<!doctype html>
<!-- Reel cover template, 1080x1920. All text stays inside the profile-grid
     safe area (y 240-1680). Placeholders {{...}} are filled by lib/cover.py.
     The agent may copy this file, edit it freely, and render it with
     `bps.py cover design --html <file>`. -->
<html dir="{{DIR}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{FONTS_URL}}">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: {{BG}}; }
  * { box-sizing: border-box; }
  .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; top: 0; background: {{BG}}; }
  .has-bg .panel { top: 930px; opacity: .93; }
  .slope { position: absolute; bottom: 240px; right: 0; height: 230px; aspect-ratio: 1.8807 / 1;
           background: {{ACCENT}}; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  [dir="rtl"] .slope { right: auto; left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .logo { position: absolute; top: 290px; left: 72px; width: 120px; height: 120px; object-fit: contain; }
  [dir="rtl"] .logo { left: auto; right: 72px; }
  .text { position: absolute; left: 72px; right: 72px; bottom: 520px; color: {{TEXT}}; }
  .no-bg .text { bottom: auto; top: 560px; }
  .kicker { font: 700 30px '{{FONT_MONO}}', monospace; letter-spacing: .18em; text-transform: uppercase;
            color: {{ACCENT}}; margin-bottom: 28px; }
  [dir="rtl"] .kicker { font-family: '{{FONT_AR}}', sans-serif; letter-spacing: 0; font-size: 36px; }
  h1 { margin: 0; font: 700 {{SIZE}}px/1.02 '{{FONT_DISPLAY}}', sans-serif; letter-spacing: -.045em; }
  [dir="rtl"] h1 { font-family: '{{FONT_AR}}', sans-serif; font-weight: 900; line-height: 1.25; letter-spacing: 0; }
  .handle { position: absolute; left: 72px; bottom: 300px; font: 500 30px '{{FONT_MONO}}', monospace; color: {{MUTED}}; }
  [dir="rtl"] .handle { left: auto; right: 72px; }
</style>
</head>
<body class="{{HAS_BG}}">
  {{BG_IMAGE}}
  <div class="panel"></div>
  <div class="slope"></div>
  {{LOGO}}
  <div class="text">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{HEADLINE}}</h1>
  </div>
  <div class="handle" dir="ltr">{{HANDLE}}</div>
</body>
</html>
